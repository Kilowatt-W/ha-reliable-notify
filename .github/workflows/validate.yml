name: Validate integration
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install "PyYAML>=6.0,<7"
      - run: python -m compileall -q custom_components/reliable_notify
      - run: node --check custom_components/reliable_notify/reliable-notify-card.js
      - run: node --input-type=module --check < custom_components/reliable_notify/reliable-notify-panel.js
      - run: python -m unittest discover -s tests -v
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration