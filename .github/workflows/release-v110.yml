name: Publish Reliable Notify v1.1.0

on:
  workflow_dispatch:
  push:
    paths:
      - RELEASE_NOTES_v1.1.0.md

permissions:
  contents: write

concurrency:
  group: reliable-notify-release-v1.1.0
  cancel-in-progress: false

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m compileall -q custom_components/reliable_notify
      - run: node --check custom_components/reliable_notify/reliable-notify-card.js
      - run: python -m unittest discover -s tests -v
      - name: Verify version number
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          assert json.loads(Path("custom_components/reliable_notify/manifest.json").read_text())["version"] == "1.1.0"
          PY

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration

  publish:
    needs: [python, hassfest, hacs]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create release after validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CURRENT_HEAD=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)
          if [ "$CURRENT_HEAD" != "${GITHUB_SHA}" ]; then
            echo "Skipping outdated commit; a newer build must be validated."
            exit 0
          fi
          if gh release view v1.1.0 >/dev/null 2>&1; then
            echo "v1.1.0 already exists"
            exit 0
          fi
          gh release create v1.1.0 \
            --title "Reliable Notify v1.1.0" \
            --notes-file RELEASE_NOTES_v1.1.0.md \
            --target "${{ github.sha }}" \
            --latest
