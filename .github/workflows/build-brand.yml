name: Build Reliable Notify brand icons
on:
  push:
    branches: ["develop/3.0"]
    paths:
      - "custom_components/reliable_notify/brand/*.svg"
      - "tools/generate_brand.py"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  brand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install "cairosvg==2.8.2"
      - run: python tools/generate_brand.py
      - name: Validate icon sizes, alpha and transparency
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          folder=Path("custom_components/reliable_notify/brand")
          for name,size in [("icon.png",(256,256)),("icon@2x.png",(512,512))]:
              with Image.open(folder/name) as image:
                  assert image.size==size
                  assert image.mode in ("RGBA","LA")
                  assert image.getpixel((0,0))[-1]==0
          PY
      - name: Commit generated brand PNG files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/reliable_notify/brand/*.png
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "brand: generate icon and logo PNG assets"
          git push origin HEAD:develop/3.0
