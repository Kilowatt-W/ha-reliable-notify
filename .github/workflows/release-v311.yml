name: Publish Reliable Notify v3.1.1

on:
  workflow_dispatch:
  push:
    paths:
      - RELEASE_NOTES_v3.1.1.md

permissions:
  contents: write

concurrency:
  group: reliable-notify-release-v3.1.1
  cancel-in-progress: false

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install "PyYAML>=6.0,<7" "voluptuous>=0.15,<1"
      - run: python -m compileall -q custom_components/reliable_notify
      - run: node --check custom_components/reliable_notify/reliable-notify-card.js
      - run: node --input-type=module --check < custom_components/reliable_notify/reliable-notify-panel.js
      - name: Validate all local brand images
        run: |
          python - <<'PY'
          from pathlib import Path
          import struct
          folder=Path("custom_components/reliable_notify/brand")
          for name,expected in (
              ("icon.png",(256,256)),("icon@2x.png",(512,512)),
              ("dark_icon.png",(256,256)),("dark_icon@2x.png",(512,512)),
              ("logo.png",(512,160)),("logo@2x.png",(1024,320))
          ):
              payload=(folder/name).read_bytes()
              assert payload[:8] == bytes.fromhex("89504e470d0a1a0a")
              assert struct.unpack(">II",payload[16:24])==expected
          PY
      - run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Verify version number
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          assert json.loads(Path("custom_components/reliable_notify/manifest.json").read_text())["version"] == "3.1.1"
          PY

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration

  home_assistant:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify integration imports with real Home Assistant Core runtime
        run: |
          docker run --rm -v "$PWD:/workspace:ro" --entrypoint python3 \
            ghcr.io/home-assistant/home-assistant:stable -c '
          import importlib,sys
          sys.path.insert(0,"/workspace")
          for module in (
              "custom_components.reliable_notify",
              "custom_components.reliable_notify.config_flow",
              "custom_components.reliable_notify.dashboard",
              "custom_components.reliable_notify.native_transport",
              "custom_components.reliable_notify.sensor",
              "custom_components.reliable_notify.notify",
              "custom_components.reliable_notify.notify_compat",
              "custom_components.reliable_notify.migration_scan",
              "custom_components.reliable_notify.templates",
              "custom_components.reliable_notify.api",
              "custom_components.reliable_notify.profiles",
              "custom_components.reliable_notify.migration_apply",
          ):
              importlib.import_module(module)
              print("Imported",module)
          '

  publish:
    needs: [python, hassfest, hacs, home_assistant]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create release after validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CURRENT_HEAD=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)
          if [ "$CURRENT_HEAD" != "${GITHUB_SHA}" ]; then
            echo "Skipping outdated commit; a newer build must be validated."
            exit 0
          fi
          if gh release view v3.1.1 >/dev/null 2>&1; then
            echo "v3.1.1 already exists"
            exit 0
          fi
          gh release create v3.1.1 \
            --title "Reliable Notify v3.1.1" \
            --notes-file RELEASE_NOTES_v3.1.1.md \
            --target "${{ github.sha }}" \
            --latest
