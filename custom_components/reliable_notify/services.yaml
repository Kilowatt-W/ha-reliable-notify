enqueue:
  name: Queue notification
  description: Persist a notification for explicit recipients or transport; without recipients/default it stays staged for manual review (no push is sent).
  fields:
    message:
      required: true
      selector:
        text:
          multiline: true
    title:
      selector:
        text:
    recipients:
      description: Named person, channel or group from reliable_notify_routes.yaml (list or string).
      selector:
        object:
    media:
      description: For Telegram recipients, photo changes send_message to send_photo; other transports retain their normal message.
      selector:
        select:
          translation_key: media
          options:
            - text
            - photo
    action:
      description: Optional direct transport action (omit when using recipients).
      selector:
        text:
    target_entity:
      description: Notify entity for direct notify.send_message.
      selector:
        entity:
          domain: notify
    data:
      description: Transport parameters such as Telegram target, inline_keyboard, file or url.
      selector:
        object:
    priority:
      selector:
        select:
          translation_key: priority
          options:
            - info
            - warning
            - critical
    message_type:
      description: Archive category, such as windows, pvec, security, or default priority.
      selector:
        text:
    archive:
      description: Keep in archive, or delete immediately after successful delivery.
      selector:
        select:
          translation_key: archive
          options:
            - keep
            - delete_after_send
    archive_days:
      description: Explicit retention override in days. Zero deletes after successful delivery.
      selector:
        number:
          min: 0
          max: 365
          mode: box
    ttl:
      selector:
        number:
          min: 0
          max: 604800
          mode: box
    dedup_key:
      selector:
        text:
    acknowledgement:
      description: Optional {required true, escalation list} with dedup_key; uses explicit acknowledge action.
      selector:
        object:
    strategy:
      selector:
        select:
          translation_key: strategy
          options:
            - always
            - replace
            - digest
    only_if:
      description: Optional current HA entity-state guard; suppress the notification before delivery if the state no longer matches (for example a closed window).
      selector:
        object:
    test_mode:
      description: Force local staging for this notification, with no delivery or escalation.
      selector:
        select:
          translation_key: test_mode
          options:
            - "off"
            - stage
retry_all:
  name: Retry waiting messages
  description: Schedule queued notifications for immediate retry.
retry_dead:
  name: Retry dead letters
  description: Return failed messages to the active queue (may cause duplicates).
clear_queue:
  name: Clear queued messages
  description: Destructively remove waiting messages (not in-flight).
cancel:
  name: Cancel waiting messages
  fields:
    dedup_key:
      required: true
      selector:
        text:
    target_entity:
      selector:
        text:
reload_routes:
  name: Reload people and groups
  description: Validate and reload /config/reliable_notify_routes.yaml without restarting HA.

retry_one:
  name: Retry a single queued notification
  fields:
    id:
      required: true
      selector:
        number:
          min: 1
          mode: box
    dead:
      description: True to restore from the dead-letter queue.
      selector:
        boolean:
delete_one:
  name: Delete one queued notification
  fields:
    id:
      required: true
      selector:
        number:
          min: 1
          mode: box
    dead:
      description: True to delete a dead-letter message.
      selector:
        boolean:
acknowledge:
  name: Acknowledge pending alert
  description: Mark a deduplication key as acknowledged and stop further escalations.
  fields:
    dedup_key:
      required: true
      selector:
        text:
    by:
      description: Human or automation identifier.
      selector:
        text:

update:
  name: Replace waiting notification
  description: Replace queued notifications sharing dedup_key, with a new message and explicit recipients.
  fields:
    dedup_key:
      required: true
      selector:
        text:
    recipients:
      required: true
      selector:
        object:
    message:
      required: true
      selector:
        text:
          multiline: true

dismiss:
  name: Dismiss Companion App notification
  description: Cancel pending notifications and enqueue clear_notification commands by deterministic tag.
  fields:
    dedup_key:
      required: true
      selector:
        text:
    recipients:
      required: true
      selector:
        object:

simulate:
  name: Simulate routing (no delivery)
  description: Read-only preview of recipients, priorities, quiet hours and archive lifetime. Does not write SQLite or send pushes. Requires response_variable.
  fields:
    message:
      required: true
      selector:
        text:
          multiline: true
    recipients:
      selector:
        object:
    priority:
      selector:
        select:
          translation_key: priority
          options:
            - info
            - warning
            - critical
    message_type:
      selector:
        text:
    archive_days:
      selector:
        number:
          min: 0
          max: 365

backup:
  name: Create consistent SQLite backup
  description: Admin-only online SQLite snapshot with integrity check. Requires response_variable. Retains configured number of prior snapshots.


send_template:
  name: Send a stored Reliable Notify template
  description: Render an admin-configured message template and enqueue it through Reliable Notify. The template name must exist in the admin panel.
  fields:
    template:
      required: true
      selector:
        text:
    variables:
      description: Simple key-value template variables.
      selector:
        object:
    recipients:
      description: Named recipients, people or groups; overrides template defaults.
      selector:
        object:
    priority:
      selector:
        select:
          translation_key: priority
          options:
            - info
            - warning
            - critical
    dedup_key:
      selector:
        text:
    message_type:
      selector:
        text:
    archive:
      selector:
        select:
          translation_key: archive
          options:
            - keep
            - delete_after_send
    archive_days:
      selector:
        number:
          min: 0
          max: 365

telegram_lifecycle:
  name: Edit or delete an already sent Telegram notification
  description: Edit/delete the most recent known Telegram message matching a deduplication key and explicitly configured chat. This calls Telegram directly and does not use retry queue.
  fields:
    recipient:
      required: true
      selector:
        text:
    dedup_key:
      required: true
      selector:
        text:
    operation:
      required: true
      selector:
        select:
          translation_key: operation
          options:
            - edit
            - delete
    message:
      description: New body required for edit operation.
      selector:
        text:
          multiline: true
